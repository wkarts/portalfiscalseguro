name: Bootstrap validated source

on:
  push:
    branches:
      - feat/publicacao-inicial-1.0.0

permissions:
  contents: write

concurrency:
  group: bootstrap-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download, verify and extract source package
        shell: bash
        env:
          SOURCE_URL: https://filebin.net/portal-fiscal-seguro-eb17a4d8045d/portal-fiscal-seguro-1.0.0.tar.xz
          SOURCE_SHA256: eb17a4d8045da5ed5355f48c5d946efaf1154e2defb05dca36e0588a00b982ff
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/portal-fiscal-seguro-1.0.0.tar.xz"
          source_dir="${RUNNER_TEMP}/portal-fiscal-source"

          curl --fail-with-body --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "${SOURCE_URL}" --output "${archive}"

          echo "${SOURCE_SHA256}  ${archive}" | sha256sum --check --strict -

          mkdir -p "${source_dir}"
          tar --extract --xz --file "${archive}" --directory "${source_dir}"
          test -f "${source_dir}/portal-fiscal-seguro/package.json"
          test -f "${source_dir}/portal-fiscal-seguro/src-tauri/Cargo.toml"
          test -f "${source_dir}/portal-fiscal-seguro/.github/workflows/ci.yml"

      - name: Replace repository tree with validated source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/portal-fiscal-source/portal-fiscal-seguro"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "${source_dir}/." .

          test ! -e .github/workflows/bootstrap-source.yml
          git status --short

      - name: Commit expanded application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: publish Portal Fiscal Seguro 1.0.0"
          git push origin "HEAD:${GITHUB_REF_NAME}"
